# Local dev and test stack. `docker compose -f deploy/compose.yaml up -d db`
# brings up MariaDB alone (the default); the `app` profile builds and runs
# the image as the card will.
services:
  db:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
    environment:
      MARIADB_ROOT_PASSWORD: goblogcfcroot
      MARIADB_DATABASE: goblogcfc
      MARIADB_USER: goblogcfc
      MARIADB_PASSWORD: goblogcfc
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      BLOG_BASE_URL: "http://localhost:8081"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: goblogcfc
      DB_USER: goblogcfc
      DB_PASSWORD: goblogcfc
      ADMIN_PASSWORD: admin
      SESSION_SECRET: dev-only-not-secret
      DATA_DIR: /var/lib/go-blogcfc
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - app-data:/var/lib/go-blogcfc

volumes:
  db-data:
  app-data:

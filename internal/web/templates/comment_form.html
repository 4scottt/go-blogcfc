<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{.Title}}</title>
<link rel="stylesheet" type="text/css" href="{{.CSSURL}}" />
</head>
<body id="popUpFormBody">
<div class="date">{{.Heading}}</div>
<div class="body">
{{- if .AllowComments}}
{{- if .Errors}}
<div id="CommentError">
 <b>{{.ErrorHeading}}:</b>
 <ul class="error">
{{- range .Errors}}
  <li>{{.}}</li>
{{- end}}
 </ul>
</div>
{{- end}}
<form action="{{.ActionURL}}" method="post" id="comment-form">
 <div class="nofLoat" style="display:none" aria-hidden="true">
  <label for="{{.HoneypotField}}">Leave this field empty</label>
  <input type="text" id="{{.HoneypotField}}" name="{{.HoneypotField}}" value="" autocomplete="off" tabindex="-1" />
 </div>
 <input type="hidden" name="{{.StampField}}" value="{{.StampValue}}" />
 <fieldset id="commentForm">
  <legend>{{.Legend}}</legend>
  <div>
   <label for="name">{{.NameLabel}}</label>
   <input type="text" id="name" name="name" value="{{.Name}}" />
  </div>
  <div>
   <label for="email">{{.EmailLabel}}</label>
   <input type="text" id="email" name="email" value="{{.Email}}" />
  </div>
  <div>
   <label for="website">{{.WebsiteLabel}}</label>
   <input type="text" id="website" name="website" value="{{.Website}}" />
  </div>
  <div>
   <label for="comment">{{.CommentLabel}}</label>
   <textarea id="comment" name="comment" rows="5" cols="45">{{.Comment}}</textarea>
  </div>
{{- if .Challenge}}
  <div>
   <input type="hidden" name="{{.TokenField}}" value="{{.ChallengeToken}}" />
   <label for="{{.AnswerField}}" class="longLabel">{{.ChallengeLabel}} <span id="challenge">{{.Challenge}}</span></label>
   <input type="text" id="{{.AnswerField}}" name="{{.AnswerField}}" size="6" autocomplete="off" />
  </div>
{{- end}}
  <div>
   <label for="remember" class="longLabel">{{.RememberLabel}}</label>
   <input type="checkbox" class="checkBox" id="remember" name="remember" value="1"{{if .Remember}} checked="checked"{{end}} />
  </div>
  <div>
   <label for="subscribe" class="longLabel">{{.SubscribeLabel}}</label>
   <input type="checkbox" class="checkBox" id="subscribe" name="subscribe" value="1"{{if .Subscribe}} checked="checked"{{end}} />
  </div>
  <p style="clear:both">{{.SubscribeText}}</p>
  <div style="text-align:center">
   <input type="submit" id="submit" name="addcomment" value="{{.SubmitLabel}}" />
  </div>
 </fieldset>
</form>
{{- else}}
<p class="commentsnotallowed">{{.NotAllowed}}</p>
{{- end}}
</div>
</body>
</html>

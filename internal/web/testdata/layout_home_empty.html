<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BlogCFC</title>
<meta name="title" content="BlogCFC" />
<meta name="description" content="" />
<meta name="keywords" content="" />
<link rel="alternate" type="application/rss+xml" title="BlogCFC" href="http://blog.example/rss" />
<link rel="icon" href="/static/images/favicon.ico">
<link rel="stylesheet" type="text/css" href="http://blog.example/static/css/site.css" />
<script>if (top != self) { top.location = self.location; }</script>
</head>
<body>
 <div id="page" class="with-sidebar">
  <div id="header-wrap">
   <div id="header" class="block-content">
    <div id="pagetitle">
     <h1 class="logo"><a href="http://blog.example/">BlogCFC</a></h1>
     <div class="clear"></div>
     <div class="search-block">
      <div class="searchform-wrap">
       <form method="get" id="searchform" action="http://blog.example/search">
        <fieldset>
         <input type="text" name="search" id="searchbox" class="searchfield" value="" />
         <input type="submit" value="Go" class="go" />
        </fieldset>
       </form>
      </div>
     </div>
    </div>
    <div id="nav-wrap1">
     <div id="nav-wrap2">
      <ul id="nav">
       <li><a href="http://blog.example/"><span>Home</span></a></li>
       <li><a href="http://blog.example/contact"><span>Contact</span></a></li>
       <li><a href="http://blog.example/search"><span>Search</span></a></li>
      </ul>
     </div>
    </div>
   </div>
   <div id="main-wrap1">
    <div id="main-wrap2">
     <div id="main" class="block-content">
      <div class="col1">
       <div id="main-content">

<h3>Sorry</h3>
<p>There are no blog entries available.</p>

       </div>
      </div>
      <div class="col2">
       <ul id="sidebar"></ul>
      </div>
      <div class="clear-content"></div>
     </div>
    </div>
   </div>
  </div>
  <div id="footer">
   <div class="block-content">
    <div class="copyright">
     go-blogcfc 0.1.0-dev, a rewrite of BlogCFC by Raymond Camden | <a href="http://blog.example/rss" rel="noindex,nofollow">RSS</a>
    </div>
   </div>
  </div>
 </div>
</body>
</html>
